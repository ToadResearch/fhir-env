[project]
name = "fhir-query-rl"
description = "FHIR Query RL: reinforcement learning for EHR search and full CRUD"
tags = ["healthcare", "fhir", "tool-use", "train", "eval"]
version = "0.4.0"
requires-python = ">=3.12,<3.14"
dependencies = [
    "verifiers==0.3.1",
    "jsonschema>=4.23,<5",
    "sqlglot>=30,<31",
]

[project.optional-dependencies]
analysis = ["matplotlib>=3.9,<4"]

[project.scripts]
fhir-query-rl = "fhir_query_rl.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fhir_query_rl", "fhir_locked_harness"]

[tool.hatch.build.targets.sdist]
include = ["fhir_query_rl", "fhir_locked_harness", "pyproject.toml", "README.md"]
