[project]
name = "fhir-workflows"
description = "FHIR Query RL: reinforcement learning for EHR search and full CRUD"
tags = ["healthcare", "fhir", "tool-use", "train", "eval"]
version = "0.3.1"
requires-python = ">=3.12"
dependencies = [
    "verifiers==0.2.2.dev6",
    "datasets>=4,<5",
    "jsonschema>=4.23,<5",
    "sqlglot>=30,<31",
]

[project.optional-dependencies]
analysis = ["matplotlib>=3.9,<4"]

[project.scripts]
fhir-query-rl = "fhir_workflows.cli:main"
fhir-workflows = "fhir_workflows.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fhir_workflows"]

[tool.hatch.build.targets.sdist]
include = ["fhir_workflows", "pyproject.toml", "README.md"]

[tool.verifiers.eval]
num_examples = 5
rollouts_per_example = 3
