[project]
name = "fhir-query-rl-workspace"
version = "0.4.0"
description = "Local development, evaluation and cluster launch tools for FHIR Query RL"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fhir-query-rl",
    "prime==0.9.3",
    "verifiers==0.3.1",
    "huggingface-hub>=1",
    "python-dotenv>=1,<2",
    "wandb==0.30.0",
    "textual==8.2.8",
]

[dependency-groups]
dev = ["pytest>=9,<10", "pytest-asyncio>=1,<2", "ruff>=0.13,<1", "hatchling>=1.27"]
analysis = ["matplotlib>=3.9,<4"]

[tool.uv]
package = false
required-version = ">=0.11.1"

[tool.uv.workspace]
members = ["environments/fhir_query_rl"]

[tool.uv.sources]
fhir-query-rl = { workspace = true }
