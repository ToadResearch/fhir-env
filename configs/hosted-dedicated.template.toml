# Future dedicated-training template; no dispatch is part of the current design work.
# Resolve namespace, service eligibility and trainer/GPU validation before use.
name = "fhir-query-rl-rest"
max_steps = 100
seq_len = 16384

[model]
name = "Qwen/Qwen3-4B"

[deployment]
num_train_gpus = 1
num_infer_gpus = 1

[orchestrator]
batch_size = 64

[orchestrator.train]
group_size = 8

[orchestrator.train.sampling]
max_completion_tokens = 2048

[[orchestrator.train.source]]
name = "fhir-rest-train"
env.id = "YOUR_NAMESPACE/fhir-query-rl"
env.args = { query_mode = "rest", discovery_variants = true, max_depth = 2, efficiency_weight = 0.0 }

[orchestrator.eval]
interval = 10

[[orchestrator.eval.source]]
name = "fhir-rest-dev"
select.limit = 200
env.id = "YOUR_NAMESPACE/fhir-query-rl"
env.args = { query_mode = "rest", discovery_variants = true, max_depth = 4, efficiency_weight = 0.0 }

[trainer.optim]
lr = 3e-6

[ckpt]

[inference]
