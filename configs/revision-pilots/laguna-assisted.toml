# Feedback-driven free campaign. Eval has no retrieval shaping.
name = "fhir-v0-2-4-laguna-assisted"
model = "poolside/Laguna-XS-2.1"
loss = "rl"
max_steps = 12
batch_size = 32
rollouts_per_example = 4
max_inflight_rollouts = 32
learning_rate = 0.00003

[sampling]
max_tokens = 2048
temperature = 0.7

[[env]]
id = "max/fhir-workflows@0.2.4"
args = {tool_profile = "assisted", tool_protocol = "native", query_mode = "rest", max_depth = 2, max_turns = 12, max_examples = 192, families = ["latest_result", "coverage_lookup", "documented_home_medications", "documented_conditions", "longitudinal_lab_trend", "medication_reconciliation", "correct_erroneous_result", "delete_duplicate_draft"], answer_mode = "json_or_fence", retrieval_weight = 0.0, demonstrations = false, efficiency_weight = 0.0}

[eval]
interval = 4
num_examples = 48
rollouts_per_example = 1
skip_first_step = false

[eval.sampling]
max_tokens = 2048
temperature = 0.0

[[eval.env]]
id = "max/fhir-workflows@0.2.4"
args = {tool_profile = "assisted", tool_protocol = "native", query_mode = "rest", max_depth = 2, max_turns = 12, max_examples = 48, families = ["latest_result", "coverage_lookup", "documented_home_medications", "documented_conditions", "longitudinal_lab_trend", "medication_reconciliation", "correct_erroneous_result", "delete_duplicate_draft"], answer_mode = "json_or_fence", retrieval_weight = 0.0, demonstrations = false, efficiency_weight = 0.0, split = "dev", eval_split = "dev"}

[[pre_batch_filters]]
type = "zero_advantage"
enforce = false

[checkpoints]
interval = 4
keep_cloud = 2

[adapters]
interval = 4
keep_last = 2

[infrastructure]
compute_size = "M"
