# Feedback-driven free campaign. Eval has no retrieval shaping.
name = "fhir-v0-2-4-llama1b-json-retrieval"
model = "sprints/Llama-3.2-1B-Instruct"
loss = "rl"
max_steps = 8
batch_size = 32
rollouts_per_example = 4
max_inflight_rollouts = 32
learning_rate = 0.00003

[sampling]
max_tokens = 2048
temperature = 0.7
extra_body = {parallel_tool_calls = false}

[[env]]
id = "max/fhir-workflows@0.2.4"
args = {tool_profile = "raw", tool_protocol = "json_action", query_mode = "rest", max_depth = 2, max_turns = 8, max_examples = 64, families = ["latest_result"], answer_mode = "json_or_fence", retrieval_weight = 0.2, demonstrations = true, efficiency_weight = 0.0}

[eval]
interval = 4
num_examples = 16
rollouts_per_example = 1
skip_first_step = false

[eval.sampling]
max_tokens = 2048
temperature = 0.0
extra_body = {parallel_tool_calls = false}

[[eval.env]]
id = "max/fhir-workflows@0.2.4"
args = {tool_profile = "raw", tool_protocol = "json_action", query_mode = "rest", max_depth = 2, max_turns = 8, max_examples = 32, families = ["latest_result"], answer_mode = "json_or_fence", retrieval_weight = 0.0, demonstrations = true, efficiency_weight = 0.0, split = "dev", eval_split = "dev"}

[[pre_batch_filters]]
type = "zero_advantage"
enforce = false

[checkpoints]
interval = 4
keep_cloud = 2

[adapters]
interval = 4
keep_last = 2

[infrastructure]
compute_size = "M"
