# Paid four-step pilot after useful free-model feedback. No efficiency/shaping reward.
name = "fhir-v0-2-5-gptoss20b-raw-pilot"
model = "openai/gpt-oss-20b"
loss = "rl"
max_steps = 4
batch_size = 16
rollouts_per_example = 4
max_inflight_rollouts = 16
learning_rate = 0.00003

[sampling]
max_tokens = 4096
temperature = 0.7

[[env]]
id = "max/fhir-workflows@0.2.5"
args = {tool_profile = "raw", tool_protocol = "native", query_mode = "rest", max_depth = 2, max_turns = 12, max_examples = 192, families = ["latest_result", "coverage_lookup", "documented_home_medications", "documented_conditions", "longitudinal_lab_trend", "medication_reconciliation", "correct_erroneous_result", "delete_duplicate_draft"], answer_mode = "json_or_fence", retrieval_weight = 0.0, demonstrations = false, efficiency_weight = 0.0}

[eval]
interval = 4
num_examples = 48
rollouts_per_example = 1
skip_first_step = false

[eval.sampling]
max_tokens = 4096
temperature = 0.0

[[eval.env]]
id = "max/fhir-workflows@0.2.5"
args = {tool_profile = "raw", tool_protocol = "native", query_mode = "rest", max_depth = 2, max_turns = 12, max_examples = 48, families = ["latest_result", "coverage_lookup", "documented_home_medications", "documented_conditions", "longitudinal_lab_trend", "medication_reconciliation", "correct_erroneous_result", "delete_duplicate_draft"], answer_mode = "json_or_fence", retrieval_weight = 0.0, demonstrations = false, efficiency_weight = 0.0, split = "dev", eval_split = "dev"}

[[pre_batch_filters]]
type = "zero_advantage"
enforce = false

[checkpoints]
interval = 4
keep_cloud = 2

[adapters]
interval = 4
keep_last = 2

[infrastructure]
compute_size = "M"
